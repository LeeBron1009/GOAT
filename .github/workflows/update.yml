name: Update history.json

on:
  schedule:
    - cron: "17 8 * * 1-5"   # 週一到週五，UTC 08:17（台灣 16:17，收盤後）
  workflow_dispatch:          # 讓你可以手動按按鈕執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install yfinance

      - name: Fetch data
        run: python fetch_history.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "chore: update history.json" && git push)
